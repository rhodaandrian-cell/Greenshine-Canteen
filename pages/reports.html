<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports — Greenshine Canteen</title>
  <link rel="stylesheet" href="../assets/css/style.css"/>
  <link rel="stylesheet" href="../assets/css/responsive.css"/>
  <link rel="stylesheet" href="../assets/css/reports.css"/>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="app-layout">

    <!-- ── Sidebar ── -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="avatar">G</div>
        <div class="sidebar-logo-text">
          <h1>Greenshine Academy</h1>
          <span>Canteen Finance System</span>
        </div>
      </div>
      <div class="sidebar-section-label">Main</div>
      <nav class="sidebar-nav">
        <a class="nav-item" href="dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
        <a class="nav-item" href="students.html"><span class="nav-icon">👤</span> Students</a>
        <a class="nav-item" href="record.html"><span class="nav-icon">✏️</span> Record Transaction</a>
      </nav>
      <div class="sidebar-section-label">Alerts</div>
      <nav class="sidebar-nav">
        <a class="nav-item" href="watchlist.html">
          <span class="nav-icon">⚠️</span> Watchlist
          <span class="nav-badge" id="watchlist-count">—</span>
        </a>
      </nav>
      <div class="sidebar-section-label">Reports</div>
      <nav class="sidebar-nav">
        <a class="nav-item active" href="reports.html">
          <span class="nav-icon">📋</span> Reports
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="avatar">A</div>
        <div>
          <div style="font-size:13px;color:var(--light)">Tr Jedida</div>
          <div style="font-size:11px;color:var(--muted)">Administrator</div>
        </div>
      </div>
    </aside>

    <!-- ── Main Content ── -->
    <div class="main-content">

      <div class="topbar">
        <div>
          <div class="topbar-title">Reports</div>
          <div class="topbar-date" id="today-date">—</div>
        </div>
        <div class="topbar-actions">
          <button class="print-btn" onclick="printReport()">🖨️ Print</button>
          <a href="debt-report.html" class="btn btn-danger btn-sm">⬇ Debt Report PDF</a>
        </div>
      </div>

      <div class="page-body">

        <!-- Report Tabs -->
        <div class="tabs">
          <button class="tab-btn active" onclick="switchReport('daily', this)">📅 Daily</button>
          <button class="tab-btn" onclick="switchReport('weekly', this)">📆 Weekly</button>
          <button class="tab-btn" onclick="switchReport('monthly', this)">🗓️ Monthly</button>
          <button class="tab-btn" onclick="switchReport('allBalances', this)">💳 All Balances</button>
          <button class="tab-btn" onclick="switchReport('byType', this)">📊 By Type</button>
        </div>

        <!-- Date Controls -->
        <div class="date-controls" id="date-wrap">
          <input type="date" id="report-date" class="form-control"
            onchange="loadReport(currentReport)" style="width:auto"/>
          <button class="btn btn-secondary btn-sm"
            onclick="document.getElementById('report-date').value=Sheets.today();loadReport(currentReport)">
            Today
          </button>
        </div>

        <!-- Report Body -->
        <div id="report-body">
          <div class="loading">
            <div class="spinner"></div> Loading report...
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/animation.js"></script>
  <script src="../js/sheets.js"></script>
  <script src="../js/reports.js"></script>
  <script src="../js/sidebar.js"></script>


<!-- Bottom Navigation — mobile phones -->
<nav class="bottom-nav">
    <a href="dashboard.html" class="bottom-nav-item">
      <span class="bottom-nav-icon">📊</span>
      <span class="bottom-nav-label">Dashboard</span>
    </a>
    <a href="students.html" class="bottom-nav-item">
      <span class="bottom-nav-icon">👤</span>
      <span class="bottom-nav-label">Students</span>
    </a>
    <a href="record.html" class="bottom-nav-item">
      <span class="bottom-nav-icon">✏️</span>
      <span class="bottom-nav-label">Record</span>
    </a>
    <a href="watchlist.html" class="bottom-nav-item">
      <span class="bottom-nav-icon">⚠️</span>
      <span class="bottom-nav-label">Watchlist</span>
    </a>
    <a href="reports.html" class="bottom-nav-item active">
      <span class="bottom-nav-icon">📋</span>
      <span class="bottom-nav-label">Reports</span>
    </a>
</nav>
</body>
</html>
